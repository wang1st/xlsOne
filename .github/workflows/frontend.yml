name: Frontend CI

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/frontend.yml"

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Stylelint (CSS)
        continue-on-error: true
        run: npx stylelint "**/*.css"
      - name: HTMLHint
        continue-on-error: true
        run: npx htmlhint "**/*.html"
