name: Multi-platform pure C packages

on:
  workflow_dispatch:
    inputs:
      deploy_to_zpulse:
        description: Deploy packages to z-pulse.cn after all builds pass
        required: true
        default: false
        type: boolean
      replace_same_version:
        description: Replace an existing release with the same version number
        required: true
        default: false
        type: boolean
      changelog:
        description: Release notes written to the update manifest
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pure-c-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          stable=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_args+=(--tag "${GITHUB_REF_NAME}")
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
              echo "Release tags must point to a commit already merged into main." >&2
              exit 1
            }
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              stable=true
            fi
          fi
          version="$(python3 scripts/ci/release_version.py "${tag_args[@]}")"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "stable=${stable}" >> "${GITHUB_OUTPUT}"
          echo "Packaging pure C xlsOne ${version}"

      - name: Validate release and deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v
          bash -n \
            scripts/deploy/setup-zpulse-deploy-user.sh \
            scripts/deploy/zpulse-promote.sh \
            c/scripts/verify_no_qt.sh

  windows:
    name: Windows amd64 (MSI + ZIP)
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      XLSONE_LICENSE_PUBLIC_KEY: ${{ secrets.ED25519_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Locate build tools
        id: tools
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT
          } elseif ($env:VCPKG_ROOT) {
            $env:VCPKG_ROOT
          } else {
            "C:\vcpkg"
          }
          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          $toolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path $vcpkg) -or -not (Test-Path $toolchain)) {
            throw "vcpkg was not found on the Windows runner"
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -or
              -not (Get-Command dark.exe -ErrorAction SilentlyContinue)) {
            throw "WiX Toolset v3 was not found on the Windows runner"
          }
          "root=$vcpkgRoot" >> $env:GITHUB_OUTPUT
          "toolchain=$toolchain" >> $env:GITHUB_OUTPUT

      - name: Install pure C dependencies
        shell: pwsh
        run: |
          & "${{ steps.tools.outputs.root }}\vcpkg.exe" install `
            sdl2:x64-windows-static `
            expat:x64-windows-static `
            zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependency installation failed"
          }

      - name: Build and test
        shell: pwsh
        run: |
          if ($env:XLSONE_LICENSE_PUBLIC_KEY -notmatch '^[0-9a-fA-F]{64}$') {
            throw "ED25519_PUBLIC_KEY is missing or malformed"
          }
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.tools.outputs.toolchain }}" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DXLSONE_C_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build-windows --config Release
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }
          ctest --test-dir build-windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      - name: Package MSI and portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          cpack --config build-windows\CPackConfig.cmake `
            -C Release -B .build -G ZIP
          if ($LASTEXITCODE -ne 0) { throw "CPack ZIP failed" }
          cpack --config build-windows\CPackConfig.cmake `
            -C Release -B .build -G WIX
          if ($LASTEXITCODE -ne 0) {
            $wixLog = Get-ChildItem .build\_CPack_Packages `
              -Recurse -Filter wix.log -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($wixLog) {
              Write-Host "WiX diagnostic log: $($wixLog.FullName)"
              Get-Content $wixLog.FullName
            }
            throw "CPack WIX failed"
          }

      - name: Verify Windows packages
        shell: pwsh
        run: |
          $msi = Get-Item ".build\xlsone-$env:VERSION-windows-amd64.msi" -ErrorAction Stop
          $zip = Get-Item ".build\xlsone-$env:VERSION-windows-amd64.zip" -ErrorAction Stop
          if ($msi.Length -le 0 -or $zip.Length -le 0) {
            throw "Windows packaging produced an empty artifact"
          }

          $portable = Join-Path $env:GITHUB_WORKSPACE ".build\portable"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $portable -Force
          $exe = Get-ChildItem $portable -Recurse -Filter xlsOne.exe |
            Select-Object -First 1
          if (-not $exe) { throw "Portable ZIP does not contain xlsOne.exe" }
          if (Get-ChildItem $portable -Recurse -File |
              Where-Object { $_.Name -match '^Qt[0-9A-Za-z_-]*\.(dll|exe)$' }) {
            throw "Portable ZIP unexpectedly contains Qt"
          }
          $portableEula = Get-ChildItem $portable -Recurse `
            -Filter EULA_zh_CN.txt | Select-Object -First 1
          if (-not $portableEula -or
              (Get-Content $portableEula.FullName -Raw) -notmatch
                '最终用户许可协议') {
            throw "Portable ZIP does not contain the original EULA"
          }

          $sampleArgs = Get-ChildItem `
            "samples\monthly-report-sample-v1.1\0[1-4]-*.xlsx" |
            Sort-Object Name |
            ForEach-Object { $_.FullName }
          $unicodeDirectory = Join-Path $env:GITHUB_WORKSPACE `
            ".build\仙居县"
          New-Item -ItemType Directory -Force $unicodeDirectory | Out-Null
          $unicodeNames = @(
            "仙居县官路镇人民政府2025乡镇报表主体信息表.xlsx",
            "仙居县安岭乡人民政府2025乡镇报表主体信息表.xlsx",
            "仙居县埠头镇人民政府2025乡镇报表主体信息表.xlsx",
            "仙居县白塔镇人民政府2025乡镇报表主体信息表.xlsx"
          )
          $unicodeArgs = for ($index = 0; $index -lt $sampleArgs.Count; $index++) {
            $destination = Join-Path $unicodeDirectory $unicodeNames[$index]
            Copy-Item -LiteralPath $sampleArgs[$index] `
              -Destination $destination -Force
            $destination
          }
          $env:XLSONE_SCREENSHOT_PATH = Join-Path $env:GITHUB_WORKSPACE `
            ".build\windows-unicode-path-smoke.bmp"
          $env:XLSONE_SCREENSHOT_SELECT = "B6"
          $env:XLSONE_SCREENSHOT_REQUIRE_WORKBOOKS = "1"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList $unicodeArgs -Wait -PassThru
          if ($process.ExitCode -ne 0 -or
              -not (Test-Path $env:XLSONE_SCREENSHOT_PATH)) {
            throw "Portable xlsOne could not open UTF-8 workbook paths"
          }
          Remove-Item Env:XLSONE_SCREENSHOT_SELECT

          $env:XLSONE_SCREENSHOT_PATH = Join-Path $env:GITHUB_WORKSPACE `
            ".build\windows-unicode-drop-smoke.bmp"
          $env:XLSONE_SCREENSHOT_DROP_ARGUMENT = "1"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList @($unicodeArgs[0]) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or
              -not (Test-Path $env:XLSONE_SCREENSHOT_PATH)) {
            throw "Portable xlsOne could not drop a UTF-8 workbook path"
          }
          Remove-Item Env:XLSONE_SCREENSHOT_DROP_ARGUMENT
          Remove-Item Env:XLSONE_SCREENSHOT_REQUIRE_WORKBOOKS

          $embeddedManifest = Join-Path $env:GITHUB_WORKSPACE `
            ".build\windows-embedded.manifest"
          mt.exe "-inputresource:$($exe.FullName);#1" `
            "-out:$embeddedManifest"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract the Windows application manifest"
          }
          $manifestText = Get-Content $embeddedManifest -Raw
          foreach ($marker in @("longPathAware", "activeCodePage", "UTF-8")) {
            if ($manifestText -notmatch [regex]::Escape($marker)) {
              throw "Windows manifest is missing $marker"
            }
          }

          $env:XLSONE_SCREENSHOT_PATH = Join-Path $env:GITHUB_WORKSPACE `
            ".build\windows-smoke.bmp"
          $env:XLSONE_SCREENSHOT_SELECT = "B6"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList $sampleArgs -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Portable xlsOne smoke test failed: $($process.ExitCode)"
          }
          if (-not (Test-Path $env:XLSONE_SCREENSHOT_PATH)) {
            throw "Portable xlsOne did not render a smoke-test frame"
          }
          Remove-Item Env:XLSONE_SCREENSHOT_SELECT

          $env:XLSONE_SCREENSHOT_PATH = Join-Path $env:GITHUB_WORKSPACE `
            ".build\windows-menu-smoke.bmp"
          $env:XLSONE_SCREENSHOT_MENU = "file"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList $sampleArgs -Wait -PassThru
          if ($process.ExitCode -ne 0 -or
              -not (Test-Path $env:XLSONE_SCREENSHOT_PATH)) {
            throw "Portable xlsOne menu smoke test failed"
          }
          Remove-Item Env:XLSONE_SCREENSHOT_MENU

          $env:XLSONE_SCREENSHOT_PATH = Join-Path $env:GITHUB_WORKSPACE `
            ".build\windows-drop-smoke.bmp"
          $env:XLSONE_SCREENSHOT_DROP_PATH = $sampleArgs[0]
          $process = Start-Process -FilePath $exe.FullName -Wait -PassThru
          if ($process.ExitCode -ne 0 -or
              -not (Test-Path $env:XLSONE_SCREENSHOT_PATH)) {
            throw "Portable xlsOne empty-state drop smoke test failed"
          }
          Remove-Item Env:XLSONE_SCREENSHOT_DROP_PATH

          $env:XLSONE_SCREENSHOT_PATH = Join-Path $env:GITHUB_WORKSPACE `
            ".build\windows-license-smoke.bmp"
          $env:XLSONE_SCREENSHOT_DIALOG = "license"
          $env:XLSONE_UI_LANGUAGE = "ja"
          $process = Start-Process -FilePath $exe.FullName -Wait -PassThru
          if ($process.ExitCode -ne 0 -or
              -not (Test-Path $env:XLSONE_SCREENSHOT_PATH)) {
            throw "Portable xlsOne license smoke test failed"
          }
          Remove-Item Env:XLSONE_SCREENSHOT_DIALOG
          Remove-Item Env:XLSONE_UI_LANGUAGE

          $env:XLSONE_SCREENSHOT_PATH = Join-Path $env:GITHUB_WORKSPACE `
            ".build\windows-language-roundtrip.bmp"
          $env:XLSONE_UI_LANGUAGE = "ja"
          $env:XLSONE_SCREENSHOT_LANGUAGE_SEQUENCE = "en,zh-Hans"
          $env:XLSONE_SCREENSHOT_MENU = "language"
          $process = Start-Process -FilePath $exe.FullName -Wait -PassThru
          if ($process.ExitCode -ne 0 -or
              -not (Test-Path $env:XLSONE_SCREENSHOT_PATH)) {
            throw "Portable xlsOne language round-trip smoke test failed"
          }
          Remove-Item Env:XLSONE_SCREENSHOT_LANGUAGE_SEQUENCE
          Remove-Item Env:XLSONE_SCREENSHOT_MENU
          Remove-Item Env:XLSONE_UI_LANGUAGE

          $admin = Join-Path $env:GITHUB_WORKSPACE ".build\msi-admin"
          New-Item -ItemType Directory -Force $admin | Out-Null
          $arguments = @(
            "/a", "`"$($msi.FullName)`"",
            "/qn", "TARGETDIR=`"$admin`""
          )
          $install = Start-Process msiexec.exe -ArgumentList $arguments `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "MSI administrative extraction failed: $($install.ExitCode)"
          }
          if (-not (Get-ChildItem $admin -Recurse -Filter xlsOne.exe |
              Select-Object -First 1)) {
            throw "MSI does not contain xlsOne.exe"
          }
          $installedEula = Get-ChildItem $admin -Recurse `
            -Filter EULA_zh_CN.txt | Select-Object -First 1
          if (-not $installedEula -or
              (Get-Content $installedEula.FullName -Raw) -notmatch
                '最终用户许可协议') {
            throw "MSI does not contain the original EULA"
          }

          $darkOutput = Join-Path $env:GITHUB_WORKSPACE ".build\msi-wix"
          New-Item -ItemType Directory -Force $darkOutput | Out-Null
          dark.exe -nologo `
            -x (Join-Path $darkOutput "files") `
            -o (Join-Path $darkOutput "product.wxs") `
            $msi.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect MSI tables"
          }
          $wixText = Get-Content (Join-Path $darkOutput "product.wxs") -Raw
          foreach ($marker in @(
            "DesktopFolder",
            "XlsOneDesktopShortcutLink",
            "WIXUI_EXITDIALOGOPTIONALCHECKBOXTEXT",
            "LaunchXlsOne"
          )) {
            if ($wixText -notmatch [regex]::Escape($marker)) {
              throw "MSI is missing installer behavior: $marker"
            }
          }

          $installRoot = Join-Path $env:GITHUB_WORKSPACE ".build\msi-installed"
          $installLog = Join-Path $env:GITHUB_WORKSPACE ".build\msi-install.log"
          $commonDesktop = [Environment]::GetFolderPath(
            [Environment+SpecialFolder]::CommonDesktopDirectory
          )
          $shortcutCandidates = @(
            (Join-Path $commonDesktop "xlsOne.lnk"),
            (Join-Path $env:PUBLIC "Desktop\xlsOne.lnk")
          ) | Select-Object -Unique
          $installArguments = @(
            "/i", "`"$($msi.FullName)`"",
            "/qn", "/norestart", "/l*v", "`"$installLog`"",
            "INSTALL_ROOT=`"$installRoot`""
          )
          try {
            $installResult = Start-Process msiexec.exe `
              -ArgumentList $installArguments -Wait -PassThru
            if ($installResult.ExitCode -ne 0) {
              throw "MSI installation failed: $($installResult.ExitCode)"
            }
            $desktopShortcut = $shortcutCandidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
            if (-not $desktopShortcut) {
              Select-String -Path $installLog `
                -Pattern "DesktopFolder|XlsOneDesktopShortcut" `
                -Context 2,2 | ForEach-Object { Write-Host $_ }
              throw "MSI did not create the common desktop shortcut"
            }
          } finally {
            $uninstallArguments = @(
              "/x", "`"$($msi.FullName)`"", "/qn", "/norestart"
            )
            Start-Process msiexec.exe -ArgumentList $uninstallArguments `
              -Wait | Out-Null
          }

          $lines = @($msi, $zip) | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE ".build\SHA256SUMS-windows.txt"),
            $lines,
            [Text.Encoding]::ASCII
          )

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: xlsone-windows-amd64
          path: |
            .build/xlsone-*-windows-amd64.msi
            .build/xlsone-*-windows-amd64.zip
            .build/SHA256SUMS-windows.txt
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS universal (DMG)
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      XLSONE_LICENSE_PUBLIC_KEY: ${{ secrets.ED25519_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build universal pure C application
        shell: bash
        run: |
          set -euo pipefail
          [[ "${XLSONE_LICENSE_PUBLIC_KEY}" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "ED25519_PUBLIC_KEY is missing or malformed" >&2
            exit 1
          }
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DXLSONE_C_FETCH_SDL2=ON \
            -DXLSONE_C_WARNINGS_AS_ERRORS=ON
          cmake --build build-macos
          ctest --test-dir build-macos --output-on-failure

      - name: Package and verify universal DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          cpack --config build-macos/CPackConfig.cmake \
            -B .build -G DragNDrop
          dmg=".build/xlsOne-${VERSION}-macos-universal.dmg"
          test -s "$dmg"
          hdiutil verify "$dmg"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse \
            -mountpoint "$mount_dir" >/dev/null
          app="$mount_dir/xlsOne.app"
          binary="$app/Contents/MacOS/xlsOne"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          test -f "$mount_dir/安装前必看.txt"
          grep -q '隐私与安全性' "$mount_dir/安装前必看.txt"
          grep -q '仍要打开' "$mount_dir/安装前必看.txt"
          grep -q '/Applications/xlsOne.app' "$mount_dir/安装前必看.txt"
          ! grep -q 'xlsOneQt' "$mount_dir/安装前必看.txt"
          test -x "$binary"
          archs="$(lipo -archs "$binary")"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleIdentifier raw \
            "$app/Contents/Info.plist")" = "cn.z-pulse.xlsone"
          test "$(plutil -extract CFBundleDisplayName raw \
            "$app/Contents/Info.plist")" = "xlsOne"
          test "$(plutil -extract CFBundlePackageType raw \
            "$app/Contents/Info.plist")" = "APPL"
          test "$(plutil -extract LSUIElement raw \
            "$app/Contents/Info.plist")" = "false"
          test "$(plutil -extract LSBackgroundOnly raw \
            "$app/Contents/Info.plist")" = "false"
          test -s "$app/Contents/Resources/xlsOne.icns"
          ! otool -L "$binary" | grep -Eiq '(^|[/[:space:]])Qt[0-9A-Za-z]'
          test -f "$app/Contents/Resources/licenses/THIRD_PARTY_NOTICES.md"
          grep -q '最终用户许可协议' \
            "$app/Contents/Resources/licenses/EULA_zh_CN.txt"

          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/macos-smoke.bmp" \
            XLSONE_SCREENSHOT_SELECT=B6 \
            "$binary" \
            samples/monthly-report-sample-v1.1/01-operations-team-1-june-2026.xlsx \
            samples/monthly-report-sample-v1.1/02-operations-team-2-june-2026.xlsx \
            samples/monthly-report-sample-v1.1/03-operations-team-3-june-2026.xlsx \
            samples/monthly-report-sample-v1.1/04-operations-team-4-june-2026.xlsx
          test -s .build/macos-smoke.bmp
          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/macos-menu-smoke.bmp" \
            XLSONE_SCREENSHOT_MENU=file \
            "$binary" \
            samples/monthly-report-sample-v1.1/01-operations-team-1-june-2026.xlsx \
            samples/monthly-report-sample-v1.1/02-operations-team-2-june-2026.xlsx \
            samples/monthly-report-sample-v1.1/03-operations-team-3-june-2026.xlsx
          test -s .build/macos-menu-smoke.bmp
          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/macos-drop-smoke.bmp" \
            XLSONE_SCREENSHOT_DROP_PATH="${GITHUB_WORKSPACE}/samples/monthly-report-sample-v1.1/01-operations-team-1-june-2026.xlsx" \
            "$binary"
          test -s .build/macos-drop-smoke.bmp
          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/macos-license-smoke.bmp" \
            XLSONE_SCREENSHOT_DIALOG=license \
            XLSONE_UI_LANGUAGE=ja \
            "$binary"
          test -s .build/macos-license-smoke.bmp
          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/macos-language-roundtrip.bmp" \
            XLSONE_UI_LANGUAGE=ja \
            XLSONE_SCREENSHOT_LANGUAGE_SEQUENCE=en,zh-Hans \
            XLSONE_SCREENSHOT_MENU=language \
            "$binary"
          test -s .build/macos-language-roundtrip.bmp

          installed_app="${HOME}/Applications/xlsOne.app"
          desktop_shortcut="${HOME}/Desktop/xlsOne.app"
          mkdir -p "${HOME}/Applications" "${HOME}/Desktop"
          rm -rf -- "$installed_app"
          rm -f -- "$desktop_shortcut"
          ditto "$app" "$installed_app"
          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/macos-installed-smoke.bmp" \
            "$installed_app/Contents/MacOS/xlsOne"
          test -L "$desktop_shortcut"
          test "$(readlink "$desktop_shortcut")" = "$installed_app"
          rm -f -- "$desktop_shortcut"
          rm -rf -- "$installed_app"
          (cd .build && shasum -a 256 "$(basename "$dmg")") \
            > .build/SHA256SUMS-macos.txt

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: xlsone-macos-universal
          path: |
            .build/xlsOne-*-macos-universal.dmg
            .build/SHA256SUMS-macos.txt
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} (DEB)
    needs: metadata
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:10-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      XLSONE_LICENSE_PUBLIC_KEY: ${{ secrets.ED25519_PUBLIC_KEY }}
    steps:
      - name: Install Debian 10 compatibility toolchain
        shell: bash
        run: |
          set -euo pipefail
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF
          printf 'Acquire::Check-Valid-Until "false";\n' \
            > /etc/apt/apt.conf.d/99xlsone-archive
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            fakeroot \
            file \
            fonts-noto-cjk \
            git \
            libexpat1-dev \
            libsdl2-dev \
            ninja-build \
            python3 \
            python3-pip \
            xauth \
            xvfb \
            zlib1g-dev
          python3 -m pip install --no-cache-dir --upgrade 'pip<24.1'
          python3 -m pip install --no-cache-dir 'cmake==3.27.9'
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build, test, and package
        shell: bash
        run: |
          set -euo pipefail
          [[ "${XLSONE_LICENSE_PUBLIC_KEY}" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "ED25519_PUBLIC_KEY is missing or malformed" >&2
            exit 1
          }
          cmake -S . -B "build-linux-${PACKAGE_ARCH}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXLSONE_PACKAGE_ARCH="${PACKAGE_ARCH}" \
            -DXLSONE_C_FETCH_SDL2=ON \
            -DXLSONE_C_WARNINGS_AS_ERRORS=ON
          cmake --build "build-linux-${PACKAGE_ARCH}"
          ctest --test-dir "build-linux-${PACKAGE_ARCH}" --output-on-failure
          mkdir -p .build
          cpack \
            --config "build-linux-${PACKAGE_ARCH}/CPackConfig.cmake" \
            -B .build -G DEB

      - name: Verify DEB and ABI
        shell: bash
        run: |
          set -euo pipefail
          deb=".build/xlsOne-${VERSION}-linux-${PACKAGE_ARCH}.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.deb_arch }}"

          unpacked="$(mktemp -d)"
          trap 'rm -rf "$unpacked"' EXIT
          dpkg-deb -x "$deb" "$unpacked"
          binary="$unpacked/usr/bin/xlsOne"
          test -x "$binary"
          test -x "$unpacked/usr/share/applications/xlsone.desktop"
          control_dir="$(mktemp -d)"
          dpkg-deb -e "$deb" "$control_dir"
          test -x "$control_dir/postinst"
          test -x "$control_dir/prerm"
          grep -q 'Desktop/xlsOne.desktop' "$control_dir/postinst"
          grep -q '最终用户许可协议' \
            "$unpacked/usr/licenses/EULA_zh_CN.txt"
          ! find "$unpacked" -type f -iname '*qt*' -print -quit | grep -q .
          ! ldd "$binary" | grep -Eiq '(^|[/[:space:]])Qt[0-9A-Za-z]'
          python3 scripts/ci/check_linux_abi.py "$deb"

          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/linux-${PACKAGE_ARCH}-smoke.bmp" \
            XLSONE_SCREENSHOT_SELECT=B6 \
            xvfb-run -a "$binary" \
            samples/monthly-report-sample-v1.1/01-operations-team-1-june-2026.xlsx \
            samples/monthly-report-sample-v1.1/02-operations-team-2-june-2026.xlsx \
            samples/monthly-report-sample-v1.1/03-operations-team-3-june-2026.xlsx \
            samples/monthly-report-sample-v1.1/04-operations-team-4-june-2026.xlsx
          test -s ".build/linux-${PACKAGE_ARCH}-smoke.bmp"
          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/linux-${PACKAGE_ARCH}-menu-smoke.bmp" \
            XLSONE_SCREENSHOT_MENU=file \
            xvfb-run -a "$binary" \
            samples/monthly-report-sample-v1.1/01-operations-team-1-june-2026.xlsx \
            samples/monthly-report-sample-v1.1/02-operations-team-2-june-2026.xlsx \
            samples/monthly-report-sample-v1.1/03-operations-team-3-june-2026.xlsx
          test -s ".build/linux-${PACKAGE_ARCH}-menu-smoke.bmp"
          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/linux-${PACKAGE_ARCH}-drop-smoke.bmp" \
            XLSONE_SCREENSHOT_DROP_PATH="${GITHUB_WORKSPACE}/samples/monthly-report-sample-v1.1/01-operations-team-1-june-2026.xlsx" \
            xvfb-run -a "$binary"
          test -s ".build/linux-${PACKAGE_ARCH}-drop-smoke.bmp"
          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/linux-${PACKAGE_ARCH}-license-smoke.bmp" \
            XLSONE_SCREENSHOT_DIALOG=license \
            XLSONE_UI_LANGUAGE=ja \
            xvfb-run -a "$binary"
          test -s ".build/linux-${PACKAGE_ARCH}-license-smoke.bmp"
          XLSONE_SCREENSHOT_PATH="${GITHUB_WORKSPACE}/.build/linux-${PACKAGE_ARCH}-language-roundtrip.bmp" \
            XLSONE_UI_LANGUAGE=ja \
            XLSONE_SCREENSHOT_LANGUAGE_SEQUENCE=en,zh-Hans \
            XLSONE_SCREENSHOT_MENU=language \
            xvfb-run -a "$binary"
          test -s ".build/linux-${PACKAGE_ARCH}-language-roundtrip.bmp"
          (cd .build && sha256sum "$(basename "$deb")") \
            > ".build/SHA256SUMS-linux-${PACKAGE_ARCH}.txt"

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: xlsone-linux-${{ matrix.arch }}
          path: |
            .build/xlsOne-*-linux-${{ matrix.arch }}.deb
            .build/SHA256SUMS-linux-${{ matrix.arch }}.txt
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  release:
    name: Create draft GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - metadata
      - windows
      - macos
      - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "${notes_file}" ]]; then
            cp "${notes_file}" release-notes.md
          else
            git for-each-ref --format='%(contents)' \
              "refs/tags/${GITHUB_REF_NAME}" > release-notes.md
          fi
          test -s release-notes.md

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: xlsone-*
          path: dist
          merge-multiple: true

      - name: Verify release payload and consolidate checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.msi' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 2
          find dist -maxdepth 1 -type f -name 'SHA256SUMS-*' -delete
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 |
              sort -z |
              xargs -0 sha256sum |
              sed 's#  \./#  #'
          ) > dist/SHA256SUMS.txt

      - name: Create or update draft release
        uses: softprops/action-gh-release@v3.0.0
        with:
          name: xlsOne ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: |
            dist/*.msi
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/SHA256SUMS.txt

  deploy_zpulse:
    name: Deploy packages to z-pulse.cn
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && needs.metadata.outputs.stable == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_zpulse)
    needs:
      - metadata
      - windows
      - macos
      - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: zpulse-production
    concurrency:
      group: z-pulse-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CHANGELOG: ${{ inputs.changelog || '' }}
      ZPULSE_HOST: ${{ vars.ZPULSE_HOST || 'z-pulse.cn' }}
      ZPULSE_PORT: ${{ vars.ZPULSE_PORT || '22' }}
      ZPULSE_USER: ${{ vars.ZPULSE_USER || 'xlsone-deploy' }}
      REPLACE_SAME_VERSION: ${{ inputs.replace_same_version || false }}
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: xlsone-*
          path: artifacts

      - name: Assemble and verify deployment payload
        shell: bash
        run: |
          set -euo pipefail
          changelog="${CHANGELOG}"
          if [[ -z "${changelog// }" ]]; then
            changelog="xlsOne ${VERSION}：纯 C 客户端，多平台安装包不再链接 Qt。"
          fi
          rm -rf zpulse-payload
          python3 scripts/ci/prepare_zpulse_release.py \
            --artifacts-dir artifacts \
            --output-dir zpulse-payload \
            --version "${VERSION}" \
            --changelog "${changelog}"
          (cd zpulse-payload/downloads && sha256sum --strict --check checksums.txt)

      - name: Upload deployment payload for audit
        uses: actions/upload-artifact@v7
        with:
          name: zpulse-release-${{ needs.metadata.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: zpulse-payload
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

      - name: Configure pinned SSH identity
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ZPULSE_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ZPULSE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_KNOWN_HOSTS}"
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/zpulse_deploy"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/zpulse_deploy" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/zpulse_deploy" > /dev/null

      - name: Upload to staging and promote atomically
        shell: bash
        run: |
          set -euo pipefail
          release_id="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_dir="/srv/xlsone-upload/incoming/${release_id}"
          ssh_common=(
            -i "${HOME}/.ssh/zpulse_deploy"
            -p "${ZPULSE_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
          )
          scp_common=(
            -i "${HOME}/.ssh/zpulse_deploy"
            -P "${ZPULSE_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
          )

          cleanup_remote() {
            ssh "${ssh_common[@]}" "${ZPULSE_USER}@${ZPULSE_HOST}" \
              "rm -rf -- '${remote_dir}'" >/dev/null 2>&1 || true
          }
          trap cleanup_remote EXIT

          ssh "${ssh_common[@]}" "${ZPULSE_USER}@${ZPULSE_HOST}" \
            "umask 027 && test ! -e '${remote_dir}' && mkdir -- '${remote_dir}'"
          scp "${scp_common[@]}" -r \
            zpulse-payload/api \
            zpulse-payload/downloads \
            "${ZPULSE_USER}@${ZPULSE_HOST}:${remote_dir}/"
          replace_flag=""
          if [[ "${REPLACE_SAME_VERSION}" == "true" ]]; then
            replace_flag=" --replace-same-version"
          fi
          ssh "${ssh_common[@]}" "${ZPULSE_USER}@${ZPULSE_HOST}" \
            "sudo -n /usr/local/sbin/xlsone-promote '${release_id}' '${VERSION}'${replace_flag}"

      - name: Verify production deployment
        shell: bash
        run: |
          set -euo pipefail
          online_manifest="$(mktemp)"
          online_checksums="$(mktemp)"
          trap 'rm -f "${online_manifest}" "${online_checksums}"' EXIT
          cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          curl_common=(
            --fail
            --silent
            --show-error
            --location
            --retry 5
            --retry-all-errors
            --retry-delay 2
            --header "Cache-Control: no-cache"
            --header "Pragma: no-cache"
          )

          curl "${curl_common[@]}" \
            "https://z-pulse.cn/api/version?deploy_verify=${cache_bust}" -o "${online_manifest}"
          curl "${curl_common[@]}" \
            "https://z-pulse.cn/downloads/checksums.txt?deploy_verify=${cache_bust}" -o "${online_checksums}"
          cmp zpulse-payload/api/version.json "${online_manifest}"
          cmp zpulse-payload/downloads/checksums.txt "${online_checksums}"

          while IFS= read -r url; do
            curl "${curl_common[@]}" --range 0-0 \
              --output /dev/null "${url}?deploy_verify=${cache_bust}"
          done < <(
            python3 -c \
              'import json,sys; print("\n".join(json.load(open(sys.argv[1], encoding="utf-8"))["downloads"].values()))' \
              "zpulse-payload/api/version.json"
          )

          {
            echo "### z-pulse.cn deployment"
            echo ""
            echo "- Version: ${VERSION}"
            echo "- Run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "- Manifest: https://z-pulse.cn/api/version"
            echo "- Checksums: https://z-pulse.cn/downloads/checksums.txt"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f "${HOME}/.ssh/zpulse_deploy" "${HOME}/.ssh/known_hosts"
