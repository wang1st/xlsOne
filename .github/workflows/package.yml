name: Multi-platform packages

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Service endpoint edition to package
        required: true
        default: domestic
        type: choice
        options:
          - domestic
          - international
      deploy_to_zpulse:
        description: Deploy the domestic build to z-pulse.cn after packaging
        required: true
        default: false
        type: boolean
      changelog:
        description: Release notes written to the update manifest
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: "6.8.3"
  EDITION: ${{ inputs.edition || vars.RELEASE_EDITION || 'domestic' }}

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      edition: ${{ steps.version.outputs.edition }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          stable=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_args+=(--tag "${GITHUB_REF_NAME}")
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
              echo "Release tags must point to a commit already merged into main." >&2
              exit 1
            }
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              stable=true
            fi
          fi
          version="$(python3 scripts/ci/release_version.py "${tag_args[@]}")"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "edition=${EDITION}" >> "${GITHUB_OUTPUT}"
          echo "stable=${stable}" >> "${GITHUB_OUTPUT}"
          echo "Packaging xlsOne ${version} (${EDITION})"

      - name: Validate release and deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v
          node --test activation/domestic-server/test/*.test.js
          bash -n \
            scripts/deploy/setup-zpulse-deploy-user.sh \
            scripts/deploy/zpulse-promote.sh

  windows:
    name: Windows amd64 (MSI + ZIP)
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      XLSONE_LICENSE_PUBLIC_KEY: ${{ secrets.ED25519_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt and matching MinGW
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true
          cache-key-prefix: qt-${{ runner.os }}-${{ env.QT_VERSION }}-mingw1310

      - name: Locate toolchains
        id: tools
        shell: pwsh
        run: |
          $mingwRoot = Get-ChildItem -LiteralPath $env:IQTA_TOOLS -Directory -ErrorAction Stop |
            Where-Object { Test-Path (Join-Path $_.FullName "bin\g++.exe") } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $mingwRoot) {
            throw "A matching MinGW toolchain was not installed under $env:IQTA_TOOLS"
          }

          $candle = (Get-Command candle.exe -ErrorAction Stop).Source
          $wixRoot = Split-Path $candle -Parent
          "mingw_root=$mingwRoot" >> $env:GITHUB_OUTPUT
          "wix_root=$wixRoot" >> $env:GITHUB_OUTPUT
          Write-Host "Qt:    $env:QT_ROOT_DIR"
          Write-Host "MinGW: $mingwRoot"
          Write-Host "WiX:   $wixRoot"

      - name: Build, test, and package
        shell: pwsh
        run: |
          $packageArgs = @{
            QtRoot = $env:QT_ROOT_DIR
            MingwRoot = '${{ steps.tools.outputs.mingw_root }}'
            WiXRoot = '${{ steps.tools.outputs.wix_root }}'
            BuildDir = "$env:GITHUB_WORKSPACE\cpp\build-windows-cn-release"
            Clean = $true
            Obfuscate = $true
          }
          if ($env:EDITION -eq 'international') {
            $packageArgs.International = $true
          }
          & .\cpp\scripts\package_windows_msi_zip.ps1 @packageArgs

      - name: Verify a real MSI upgrade and installed startup
        shell: pwsh
        run: |
          & .\cpp\scripts\verify_windows_msi_upgrade.ps1 `
            -PreviousMsiPath ".\site\downloads\xlsone-1.0.5-windows-amd64.msi" `
            -CandidateMsiPath ".build\xlsone-$env:VERSION-windows-amd64.msi" `
            -ExpectedVersion $env:VERSION `
            -QtMajor 6

      - name: Upload MSI upgrade logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xlsone-windows-msi-upgrade-logs
          path: .build/xlsone-msi-upgrade-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify package artifacts and write checksums
        shell: pwsh
        run: |
          $msi = Get-Item ".build\xlsone-$env:VERSION-windows-amd64.msi" -ErrorAction Stop
          $zip = Get-Item ".build\xlsone-$env:VERSION-windows-amd64.zip" -ErrorAction Stop

          if ($msi.Length -le 0 -or $zip.Length -le 0) {
            throw "Windows packaging produced an empty artifact"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $buffer = New-Object byte[] 1048576
            foreach ($entry in $archive.Entries) {
              $stream = $entry.Open()
              try {
                while ($stream.Read($buffer, 0, $buffer.Length) -gt 0) {}
              } finally {
                $stream.Dispose()
              }
            }
          } finally {
            $archive.Dispose()
          }

          $lines = @($msi, $zip) | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE ".build\SHA256SUMS-windows.txt"),
            $lines,
            [Text.Encoding]::ASCII
          )

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: xlsone-windows-amd64
          path: |
            .build/xlsone-*-windows-amd64.msi
            .build/xlsone-*-windows-amd64.zip
            .build/SHA256SUMS-windows.txt
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS universal (DMG)
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      XLSONE_USE_CREATE_DMG: "0"
      XLSONE_LICENSE_PUBLIC_KEY: ${{ secrets.ED25519_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install universal Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true
          cache-key-prefix: qt-${{ runner.os }}-${{ env.QT_VERSION }}-universal

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          package_args=(
            --arch universal
            --version "${VERSION}"
            --build-dir "${GITHUB_WORKSPACE}/cpp/build-macos-universal-release"
            --obfuscate
          )
          if [[ "${EDITION}" == "international" ]]; then
            package_args+=(--international)
          fi
          ./cpp/scripts/package_macos_qt_dmg.sh "${package_args[@]}"

      - name: Test and verify package
        shell: bash
        run: |
          set -euo pipefail
          build_dir="cpp/build-macos-universal-release"
          app="$build_dir/universal/xlsOneQt.app"
          binary="$app/Contents/MacOS/xlsOneQt"
          dmg=".build/xlsOne-${VERSION}-macos-universal.dmg"

          ctest --test-dir "$build_dir/arm64" --output-on-failure
          archs="$(lipo -archs "$binary")"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          codesign --verify --deep --strict "$app"
          hdiutil verify "$dmg"
          (cd .build && shasum -a 256 "$(basename "$dmg")") \
            > .build/SHA256SUMS-macos.txt

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: xlsone-macos-universal
          path: |
            .build/xlsOne-*-macos-universal.dmg
            .build/SHA256SUMS-macos.txt
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} (DEB)
    needs: metadata
    runs-on: ${{ matrix.runner }}
    # Compile inside the oldest supported userspace instead of inheriting the
    # Ubuntu 22.04 runner ABI.  The native runner architecture selects the
    # matching amd64/arm64 image from Debian's multi-arch manifest.
    container:
      image: debian:10-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      QT_SELECT: qt5
      XLSONE_LICENSE_PUBLIC_KEY: ${{ secrets.ED25519_PUBLIC_KEY }}
    steps:
      - name: Install Debian 10 compatibility toolchain
        shell: bash
        run: |
          set -euo pipefail

          # Debian 10 is EOL and intentionally used only as a build sysroot.
          # Its archived packages provide glibc 2.28 and GCC 8/libstdc++
          # (GLIBCXX <= 3.4.25), matching the Kylin/UOS compatibility floor.
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF
          printf 'Acquire::Check-Valid-Until "false";\n' \
            > /etc/apt/apt.conf.d/99xlsone-archive
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            git \
            ninja-build \
            python3 \
            python3-pip \
            qt5-qmake \
            qtbase5-dev \
            qtbase5-dev-tools \
            qttools5-dev-tools \
            xz-utils \
            zstd \
            zlib1g-dev

          # Debian 10's distro CMake is 3.13, while this project requires
          # 3.22+.  This release has native manylinux wheels for both runner
          # architectures and still runs on Python 3.7 / glibc 2.28.
          python3 -m pip install --no-cache-dir --upgrade 'pip<24.1'
          python3 -m pip install --no-cache-dir 'cmake==3.27.9'

          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          cmake --version
          g++ --version

      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache the Linux Qt runtime bundle
        uses: actions/cache@v5
        with:
          path: cpp/deepin-qt5.15
          key: deepin-qt5.15-${{ matrix.arch }}-${{ hashFiles('cpp/scripts/package_linux_deb.sh', 'cpp/third_party/runtime-debs/*') }}

      - name: Build, test, and package
        shell: bash
        run: |
          set -euo pipefail
          package_args=(--bundle --obfuscate)
          if [[ "${EDITION}" == "international" ]]; then
            package_args+=(--international)
          fi
          package_args+=("${GITHUB_WORKSPACE}/cpp/build-linux-${PACKAGE_ARCH}-release")
          ./cpp/scripts/package_linux_deb.sh "${package_args[@]}"
          ctest \
            --test-dir "cpp/build-linux-${PACKAGE_ARCH}-release" \
            --output-on-failure

      - name: Verify package and write checksum
        shell: bash
        run: |
          set -euo pipefail
          deb=".build/xlsone-${VERSION}-linux-${PACKAGE_ARCH}.deb"
          test -f "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.deb_arch }}"

          unpacked="$(mktemp -d)"
          trap 'rm -rf "$unpacked"' EXIT
          dpkg-deb -x "$deb" "$unpacked"
          test -x "$unpacked/usr/bin/xlsOneQt"
          test -x "$unpacked/usr/bin/xlsone.sh"
          find "$unpacked/usr/lib/xlsone" -name 'libQt5Core.so*' -print -quit | grep -q .
          test -f "$unpacked/usr/lib/xlsone/plugins/platforms/libqxcb.so"
          ./cpp/scripts/validate_deb.sh "$deb"
          python3 scripts/ci/check_linux_abi.py "$deb"
          (cd .build && sha256sum "$(basename "$deb")") \
            > ".build/SHA256SUMS-linux-${PACKAGE_ARCH}.txt"

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: xlsone-linux-${{ matrix.arch }}
          path: |
            .build/xlsone-*-linux-${{ matrix.arch }}.deb
            .build/SHA256SUMS-linux-${{ matrix.arch }}.txt
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  release:
    name: Create draft GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - metadata
      - windows
      - macos
      - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: xlsone-*
          path: dist
          merge-multiple: true

      - name: Verify release payload and consolidate checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.msi' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 2

          find dist -maxdepth 1 -type f -name 'SHA256SUMS-*' -delete
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 |
              sort -z |
              xargs -0 sha256sum |
              sed 's#  \./#  #'
          ) > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Create or update draft release
        uses: softprops/action-gh-release@v3.0.0
        with:
          name: xlsOne ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Automated ${{ env.EDITION }} multi-platform build.

            These packages are currently unsigned. Verify `SHA256SUMS.txt` before testing.
          files: |
            dist/*.msi
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/SHA256SUMS.txt

  deploy_zpulse:
    name: Deploy domestic packages to z-pulse.cn
    if: >-
      needs.metadata.outputs.edition == 'domestic' &&
      ((github.event_name == 'push' && github.ref_type == 'tag' && needs.metadata.outputs.stable == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_zpulse))
    needs:
      - metadata
      - windows
      - macos
      - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: zpulse-production
    concurrency:
      group: z-pulse-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CHANGELOG: ${{ inputs.changelog || '' }}
      ZPULSE_HOST: ${{ vars.ZPULSE_HOST || 'z-pulse.cn' }}
      ZPULSE_PORT: ${{ vars.ZPULSE_PORT || '22' }}
      ZPULSE_USER: ${{ vars.ZPULSE_USER || 'xlsone-deploy' }}
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: xlsone-*
          path: artifacts

      - name: Assemble and verify deployment payload
        shell: bash
        run: |
          set -euo pipefail
          changelog="${CHANGELOG}"
          if [[ -z "${changelog// }" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            changelog="$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")"
          fi
          if [[ -z "${changelog// }" ]]; then
            changelog="发布 xlsOne ${VERSION}"
          fi

          rm -rf zpulse-payload
          python3 scripts/ci/prepare_zpulse_release.py \
            --artifacts-dir artifacts \
            --output-dir zpulse-payload \
            --version "${VERSION}" \
            --changelog "${changelog}"
          (cd zpulse-payload/downloads && sha256sum --strict --check checksums.txt)

      - name: Upload deployment payload for audit
        uses: actions/upload-artifact@v7
        with:
          name: zpulse-release-${{ needs.metadata.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: zpulse-payload
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

      - name: Configure pinned SSH identity
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ZPULSE_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ZPULSE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_KNOWN_HOSTS}"
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/zpulse_deploy"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/zpulse_deploy" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/zpulse_deploy" > /dev/null

      - name: Upload to staging and promote atomically
        shell: bash
        run: |
          set -euo pipefail
          release_id="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_dir="/srv/xlsone-upload/incoming/${release_id}"
          ssh_common=(
            -i "${HOME}/.ssh/zpulse_deploy"
            -p "${ZPULSE_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
          )
          scp_common=(
            -i "${HOME}/.ssh/zpulse_deploy"
            -P "${ZPULSE_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
          )

          cleanup_remote() {
            ssh "${ssh_common[@]}" "${ZPULSE_USER}@${ZPULSE_HOST}" \
              "rm -rf -- '${remote_dir}'" >/dev/null 2>&1 || true
          }
          trap cleanup_remote EXIT

          ssh "${ssh_common[@]}" "${ZPULSE_USER}@${ZPULSE_HOST}" \
            "umask 027 && test ! -e '${remote_dir}' && mkdir -- '${remote_dir}'"
          scp "${scp_common[@]}" -r \
            zpulse-payload/api \
            zpulse-payload/downloads \
            "${ZPULSE_USER}@${ZPULSE_HOST}:${remote_dir}/"
          ssh "${ssh_common[@]}" "${ZPULSE_USER}@${ZPULSE_HOST}" \
            "sudo -n /usr/local/sbin/xlsone-promote '${release_id}' '${VERSION}'"

      - name: Verify production deployment
        shell: bash
        run: |
          set -euo pipefail
          online_manifest="$(mktemp)"
          online_checksums="$(mktemp)"
          trap 'rm -f "${online_manifest}" "${online_checksums}"' EXIT
          cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          curl_common=(
            --fail
            --silent
            --show-error
            --location
            --retry 5
            --retry-all-errors
            --retry-delay 2
            --header "Cache-Control: no-cache"
            --header "Pragma: no-cache"
          )

          curl "${curl_common[@]}" \
            "https://z-pulse.cn/api/version?deploy_verify=${cache_bust}" -o "${online_manifest}"
          curl "${curl_common[@]}" \
            "https://z-pulse.cn/downloads/checksums.txt?deploy_verify=${cache_bust}" -o "${online_checksums}"
          cmp zpulse-payload/api/version.json "${online_manifest}"
          cmp zpulse-payload/downloads/checksums.txt "${online_checksums}"

          python3 - "zpulse-payload/api/version.json" "${VERSION}" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if manifest.get("latest_version") != sys.argv[2]:
              raise SystemExit("release manifest version mismatch")
          for url in manifest.get("downloads", {}).values():
              print(url)
          PY

          while IFS= read -r url; do
            curl "${curl_common[@]}" --range 0-0 \
              --output /dev/null "${url}?deploy_verify=${cache_bust}"
          done < <(
            python3 -c \
              'import json,sys; print("\n".join(json.load(open(sys.argv[1], encoding="utf-8"))["downloads"].values()))' \
              "zpulse-payload/api/version.json"
          )

          {
            echo "### z-pulse.cn deployment"
            echo ""
            echo "- Version: ${VERSION}"
            echo "- Run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "- Manifest: https://z-pulse.cn/api/version"
            echo "- Checksums: https://z-pulse.cn/downloads/checksums.txt"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f "${HOME}/.ssh/zpulse_deploy" "${HOME}/.ssh/known_hosts"
