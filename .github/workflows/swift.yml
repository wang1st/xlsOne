name: Swift CI

on:
  push:
    branches: [main, master]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".swiftlint.yml"
      - ".github/workflows/swift.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".swiftlint.yml"
      - ".github/workflows/swift.yml"

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Build · Test · Lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Install SwiftLint & SwiftFormat
        run: brew install swiftlint swiftformat

      - name: Format check (SwiftFormat)
        # 首次接入：仓库尚未统一格式，先用 `|| true` 仅作提示、不阻断。
        # 团队本地执行一次 `make format` 归一化后，去掉 `|| true` 使其成为硬性门禁。
        run: swiftformat --lint Sources Tests --reporter github-actions-log || true

      - name: Lint (SwiftLint)
        # 当前仓库仍有历史 lint 债务；保留完整注解但不跳过后续编译测试。
        # 基线清零后删除 continue-on-error，使其重新成为硬门禁。
        continue-on-error: true
        run: swiftlint lint --reporter github-actions-logging

      - name: Build & Test
        run: swift test
