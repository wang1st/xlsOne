name: C++ Qt Port

on:
  push:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-qt.yml"
  pull_request:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-qt.yml"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt (Linux)
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.3"
          cache: true

      - name: Install Qt and matching MinGW (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.3"
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Configure
        working-directory: cpp
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DXLSONE_OBFUSCATE=OFF
          -DXLSONE_BUNDLE_QT=OFF

      - name: Build
        working-directory: cpp
        run: cmake --build build-ci --parallel

      - name: Test
        working-directory: cpp
        run: ctest --test-dir build-ci --output-on-failure

  format-check:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-format
        run: pip install clang-format==18.*
      - name: Check formatting
        # 首次接入：当前 C++ 代码尚未统一格式，先继续(不阻断)。
        # 团队执行一次 `find cpp \( -name '*.cpp' -o -name '*.h' \) -not -path '*/build*' | xargs clang-format -i`
        # 归一化后，去掉下面的 continue-on-error 使其成为硬性门禁。
        continue-on-error: true
        run: |
          find cpp \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.cc' \) \
            -not -path '*/build*' -not -path '*/build-*' \
            | xargs clang-format --dry-run --Werror
