name: C++ Qt Port

on:
  push:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-qt.yml"
  pull_request:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-qt.yml"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        working-directory: cpp
        run: cmake --preset ${{ runner.os == 'Windows' && 'windows-release' || 'linux-release' }}

      - name: Build
        working-directory: cpp
        run: cmake --build --preset ${{ runner.os == 'Windows' && 'windows-release' || 'linux-release' }}

      - name: Test
        working-directory: cpp
        run: ctest --preset ${{ runner.os == 'Windows' && 'windows-release' || 'linux-release' }}

  format-check:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install clang-format==18.*
      - name: Check formatting
        # 首次接入：当前 C++ 代码尚未统一格式，先继续(不阻断)。
        # 团队执行一次 `find cpp \( -name '*.cpp' -o -name '*.h' \) -not -path '*/build*' | xargs clang-format -i`
        # 归一化后，去掉下面的 continue-on-error 使其成为硬性门禁。
        continue-on-error: true
        run: |
          find cpp \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.cc' \) \
            -not -path '*/build*' -not -path '*/build-*' \
            | xargs clang-format --dry-run --Werror
