server {
    listen 80;
    listen [::]:80;
    server_name z-pulse.cn www.z-pulse.cn;

    root /var/www/z-pulse.cn;
    index index.html;

    access_log /var/log/nginx/z-pulse.cn-access.log;
    error_log /var/log/nginx/z-pulse.cn-error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location /css/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Canonical URLs — keep old links working without creating duplicate pages.
    location = /xlsone {
        return 301 https://z-pulse.cn/;
    }

    location = /xlsone/ {
        return 301 https://z-pulse.cn/;
    }

    location = /products/xlsone/ {
        return 301 https://z-pulse.cn/;
    }

    location = /products/xlsone/download.html {
        return 301 https://z-pulse.cn/xlsone/download.html;
    }

    location = /xlsone/buy.html {
        return 301 https://z-pulse.cn/support/;
    }

    # API endpoint — ensures JSON Content-Type
    location = /api/version {
        alias /var/www/z-pulse.cn/api/version.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Downloads directory
    location /downloads/ {
        alias /var/www/z-pulse.cn/downloads/;
        autoindex off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        types {
            application/octet-stream dmg;
            application/octet-stream exe;
            application/octet-stream AppImage;
            application/vnd.debian.binary-package deb;
        }
    }

    location = /xlsone/offline {
        proxy_pass http://127.0.0.1:8787/offline;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /xlsone/license-console {
        proxy_pass http://127.0.0.1:8787/xlsone/license-console;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }
}
