<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载 · 表表归一</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
    <div class="container">
        <a href="/" class="nav-brand">ZENITH PULSE</a>
        <div class="nav-links">
            <a href="/products/xlsone/">表表归一</a>
            <a href="/support/">支持</a>
        </div>
    </div>
</nav>

<main>
    <section class="download-section" style="padding-top:120px">
        <div class="container">
            <h2 class="section-title" style="margin-bottom:12px">下载</h2>
            <p style="text-align:center;color:#86868b;font-size:0.95rem;margin-bottom:48px">
                表表归一 v<span id="ver">-</span>
            </p>

            <div class="download-list">
                <div class="download-card">
                    <div>
                        <div class="platform">macOS</div>
                        <div class="meta">Apple Silicon &amp; Intel · macOS 12+</div>
                    </div>
                    <a id="dl-macos" href="#" class="btn btn-outline">macOS 版</a>
                </div>
                <div class="download-card">
                    <div>
                        <div class="platform">Windows</div>
                        <div class="meta">Windows 10 / 11 ARM64</div>
                    </div>
                    <a id="dl-windows" href="#" class="btn btn-outline">Windows 版</a>
                </div>
                <div class="download-card">
                    <div>
                        <div class="platform">Linux</div>
                        <div class="meta">ARM64 · Ubuntu 20.04+ / Debian 11+ / UOS</div>
                    </div>
                    <a id="dl-linux" href="#" class="btn btn-outline">下载 DEB</a>
                </div>
            </div>

            <p style="text-align:center;color:#86868b;font-size:0.85rem;margin-top:48px">
                Mac App Store 版本准备中。
            </p>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <a href="/support/">支持</a>
        <a href="/privacy/">隐私政策</a>
        <p class="copyright">&copy; 2026 ZENITH PULSE</p>
    </div>
</footer>

<script>
fetch('/api/version.json?v=0.3.0')
    .then(r => r.json())
    .then(data => {
        document.getElementById('ver').textContent = data.latest_version;
        if (data.downloads.macos)
            document.getElementById('dl-macos').href = data.downloads.macos;
        if (data.downloads.windows)
            document.getElementById('dl-windows').href = data.downloads.windows;
        if (data.downloads.linux)
            document.getElementById('dl-linux').href = data.downloads.linux;
    })
    .catch(() => {
        document.getElementById('ver').textContent = '（加载失败）';
    });
</script>

</body>
</html>
