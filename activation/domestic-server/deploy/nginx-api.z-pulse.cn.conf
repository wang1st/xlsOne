# xlsOne 国内激活 API —— 独立子域名 api.z-pulse.cn
# 前置条件：DNS 已添加 A 记录 api.z-pulse.cn -> 47.97.115.235，
# 并已执行 `certbot --nginx -d api.z-pulse.cn` 签发证书（certbot 会自动改写本文件补上 ssl 指令）。
# 在证书签发前，本文件不要放到 conf.d/（会导致 nginx -t 失败）。
# 未配 DNS 前，可临时使用 z-pulse.cn 主站的 /api 与 /offline 代理（见 install.sh）。

server {
    listen 80;
    listen [::]:80;
    server_name api.z-pulse.cn;

    # 让 certbot 的 HTTP-01 校验可通过；其余转发到后端
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.z-pulse.cn;

    # 以下 ssl 指令由 certbot 自动注入；手动部署可改为：
    # ssl_certificate     /etc/letsencrypt/live/api.z-pulse.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.z-pulse.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
