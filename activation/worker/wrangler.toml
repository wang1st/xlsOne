name = "xlsone-activation-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[[d1_databases]]
binding = "DB"
database_name = "xlsone-license"
database_id = "xlsone-license-db"

[vars]
ACTIVATION_SECRET = ""  # 运行时通过 wrangler secret put 设置
LEMON_SQUEEZY_SIGNING_SECRET = ""  # Lemon Squeezy webhook 签名密钥

# 以下值需通过 wrangler secret put 设置，不应写入本文件：
# ED25519_PRIVATE_KEY    — Windows 版 Ed25519 签名私钥（64 字符十六进制）
#   ⚠️ 切勿把真实私钥写入本文件或提交到仓库。生产环境用下方命令设置：
#       wrangler secret put ED25519_PRIVATE_KEY
#   并在 cpp/core/src/license_manager.cpp 中同步更新对应的公钥。
#   示例密钥对已从仓库移除，禁止复用（曾公开，可被用于伪造授权）。
# AFDIAN_USER_ID         — 爱发电用户 ID
# AFDIAN_TOKEN           — 爱发电开放平台 Token
# AFDIAN_WEBHOOK_TOKEN   — 爱发电 Webhook Token
# ADMIN_API_KEY          — 管理后台接口密钥（可选，默认使用 ACTIVATION_SECRET）

[env.production]
routes = [
  { pattern = "api.xlsone.com", custom_domain = true },
  { pattern = "api.z-pulse.cn", custom_domain = true }
]
