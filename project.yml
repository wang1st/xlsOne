name: xlsOne
options:
  bundleIdPrefix: com.xlsone
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"

packages:
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX
    from: "0.14.0"

targets:
  xlsOne:
    type: application
    platform: macOS
    sources:
      - path: Sources/xlsOne
      - path: Sources/xlsOneCore
    dependencies:
      - package: CoreXLSX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xlsone.app
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 xlsOne. All rights reserved."
        INFOPLIST_KEY_CFBundleDisplayName: xlsOne
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "/opt/homebrew/lib"
        HEADER_SEARCH_PATHS:
          - "/opt/homebrew/include"

schemes:
  xlsOne:
    build:
      targets:
        xlsOne: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
